<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReturnHer - Your journey paused. Your opportunities didn't.</title>
  <meta name="description" content="ReturnHer helps women across India find government-supported ways to study, get certified and earn, matched to her education, skills, goal and district.">

  <!-- Google Fonts: Fraunces, Nunito Sans, Noto Serif Devanagari, Noto Sans Devanagari -->

  <!-- Shared Prototype Notice Banner (BRIEF.md requirement) -->
