<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Plain cream background -->
  <rect width="400" height="400" fill="#FFF6E5" />

  <!-- Background organic color block (Cobalt & Blush) -->
  <path d="M80,60 C200,20 330,45 360,150 C390,250 320,360 200,370 C80,380 30,280 40,170 C50,110 60,70 80,60 Z" fill="#F1E8D8" />
  <circle cx="100" cy="90" r="50" fill="#F6C1CF" opacity="0.65" />

  <!-- Decorative motifs (lotus, sun rays, rangoli dots) -->
  <g transform="translate(45, 50)">
    <!-- Lotus motif -->
    <path d="M24,4 C28,14 32,24 24,34 C16,24 20,14 24,4 Z" fill="#D6336C" />
    <path d="M24,34 C33,32 40,25 42,13 C36,20 30,26 24,34 Z" fill="#F6C1CF" />
    <path d="M24,34 C15,32 8,25 6,13 C12,20 18,26 24,34 Z" fill="#F6C1CF" />
    <circle cx="24" cy="34" r="3" fill="#FFC21A" />
  </g>
  <g transform="translate(310, 50)">
    <!-- Radiant Indian Sun -->
    <circle cx="24" cy="24" r="11" fill="#FFC21A" />
    <line x1="24" y1="4" x2="24" y2="9" stroke="#D2401F" stroke-width="2.5" stroke-linecap="round" />
    <line x1="24" y1="39" x2="24" y2="44" stroke="#D2401F" stroke-width="2.5" stroke-linecap="round" />
    <line x1="4" y1="24" x2="9" y2="24" stroke="#D2401F" stroke-width="2.5" stroke-linecap="round" />
    <line x1="39" y1="24" x2="44" y2="24" stroke="#D2401F" stroke-width="2.5" stroke-linecap="round" />
    <line x1="10" y1="10" x2="13" y2="13" stroke="#FFC21A" stroke-width="2.5" stroke-linecap="round" />
    <line x1="35" y1="35" x2="38" y2="38" stroke="#FFC21A" stroke-width="2.5" stroke-linecap="round" />
    <line x1="38" y1="10" x2="35" y2="13" stroke="#FFC21A" stroke-width="2.5" stroke-linecap="round" />
    <line x1="10" y1="38" x2="13" y2="35" stroke="#FFC21A" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <g transform="translate(320, 270)" fill="#FFC21A">
    <circle cx="10" cy="10" r="3.5" />
    <circle cx="28" cy="10" r="3.5" fill="#D2401F" />
    <circle cx="10" cy="28" r="3.5" fill="#2B59D9" />
    <circle cx="28" cy="28" r="4.5" fill="#0E4B33" />
  </g>

  <!-- ================= STACK OF ACADEMIC BOOKS ================= -->
  <g transform="translate(245, 230)">
    <!-- Book 1 (Bottom, thick cobalt) -->
    <rect x="0" y="55" width="80" height="22" rx="3" fill="#2B59D9" />
    <rect x="4" y="52" width="70" height="6" fill="#FFF6E5" />
    <path d="M12,65 L12,73 L17,69 L22,73 L22,65 Z" fill="#FFC21A" />
    <!-- Book 2 (Middle, vermilion) -->
    <rect x="8" y="32" width="72" height="20" rx="3" fill="#D2401F" />
    <rect x="12" y="29" width="62" height="6" fill="#FFF6E5" />
    <!-- Book 3 (Top, forest green) -->
    <rect x="18" y="12" width="60" height="18" rx="3" fill="#0E4B33" />
    <rect x="22" y="9" width="50" height="5" fill="#FFF6E5" />
    <path d="M55,20 L55,28 L59,24 L63,28 L63,20 Z" fill="#F6C1CF" />
  </g>

  <!-- ================= WOMAN SCHOLAR IN GRADUATION GOWN ================= -->
  <g transform="translate(100, 65) scale(1.15)">
    <!-- Academic Robe / Gown in Deep Blue/Cobalt -->
    <path d="M38,115 L102,115 L112,265 L28,265 Z" fill="#2B59D9" />
    <!-- Robe golden sash/stole across shoulders -->
    <path d="M46,115 L56,220 L68,220 L58,115 Z" fill="#FFC21A" />
    <path d="M94,115 L84,220 L72,220 L82,115 Z" fill="#FFC21A" />
    <!-- Inner Kurta / Collar -->
    <polygon points="62,115 70,140 78,115" fill="#FFF6E5" />

    <!-- Neck & Head -->
    <rect x="65" y="85" width="10" height="30" fill="#C08052" />
    <circle cx="70" cy="68" r="19" fill="#C08052" />
    <!-- Sleek Hair Bun -->
    <circle cx="70" cy="46" r="12" fill="#3A2418" />
    <path d="M51,68 C51,50 60,49 70,49 C80,49 89,50 89,68 C85,55 78,53 70,53 C62,53 55,55 51,68 Z" fill="#3A2418" />

    <!-- Intellectual & Peaceful Expression with Glasses -->
    <circle cx="64" cy="68" r="7" stroke="#2A2622" stroke-width="1.6" fill="none" />
    <circle cx="76" cy="68" r="7" stroke="#2A2622" stroke-width="1.6" fill="none" />
    <line x1="71" y1="68" x2="69" y2="68" stroke="#2A2622" stroke-width="1.6" />
    <path d="M60,67 Q64,70 68,67" stroke="#2A2622" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M72,67 Q76,70 80,67" stroke="#2A2622" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M66,78 Q70,82 74,78" stroke="#2A2622" stroke-width="2" fill="none" stroke-linecap="round" />
    <circle cx="70" cy="60" r="1.8" fill="#D2401F" />

    <!-- Graduation Mortarboard Cap -->
    <polygon points="70,30 96,39 70,48 44,39" fill="#2A2622" />
    <rect x="56" y="41" width="28" height="9" rx="2" fill="#2A2622" />
    <circle cx="70" cy="39" r="2.2" fill="#FFC21A" />
    <path d="M70,39 L86,46 L88,56" stroke="#FFC21A" stroke-width="2.2" fill="none" stroke-linecap="round" />

    <!-- Right Hand resting proudly on books stack -->
    <path d="M96,115 L124,145 L118,152 L90,125 Z" fill="#2B59D9" />
    <circle cx="122" cy="154" r="6" fill="#C08052" />

    <!-- Left Arm holding up the Chemistry / Research Flask -->
    <path d="M44,115 L24,142 L34,148 L54,125 Z" fill="#2B59D9" />
    <circle cx="26" cy="146" r="6" fill="#C08052" />

    <!-- ================= SCIENTIFIC LAB FLASK ================= -->
    <g transform="translate(6, 126)">
      <!-- Conical Flask Body -->
      <polygon points="16,14 26,14 34,42 8,42" fill="rgba(255,255,255,0.85)" stroke="#2A2622" stroke-width="2" />
      <!-- Liquid filling (Cobalt) -->
      <polygon points="9.5,41 32.5,41 29,29 13,29" fill="#2B59D9" />
      <!-- Flask neck rim -->
      <line x1="14" y1="14" x2="28" y2="14" stroke="#2A2622" stroke-width="2.5" />
      <!-- Measurement tick marks -->
      <line x1="21" y1="24" x2="25" y2="24" stroke="#2A2622" stroke-width="1.2" />
      <line x1="22" y1="30" x2="27" y2="30" stroke="#FFF6E5" stroke-width="1.2" />
      <line x1="24" y1="36" x2="29" y2="36" stroke="#FFF6E5" stroke-width="1.2" />
      <!-- Rising reaction bubbles -->
      <circle cx="21" cy="20" r="1.5" fill="#FFC21A" />
      <circle cx="19" cy="26" r="1.5" fill="#FFF6E5" />
    </g>
  </g>
</svg>
