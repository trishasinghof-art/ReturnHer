<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Plain cream background -->
  <rect width="400" height="400" fill="#FFF6E5" />

  <!-- Background organic warmth -->
  <path d="M70,50 C200,20 330,50 360,150 C390,250 310,360 190,370 C70,380 30,290 35,180 C40,110 50,70 70,50 Z" fill="#F1E8D8" />

  <!-- Sunlit Arched Window in Background (Left) -->
  <g transform="translate(45, 55)">
    <!-- Arch opening -->
    <path d="M0,130 L0,50 C0,20 20,0 50,0 C80,0 100,20 100,50 L100,130 Z" fill="#FFF6E5" stroke="#0E4B33" stroke-width="4" />
    <line x1="50" y1="0" x2="50" y2="130" stroke="#0E4B33" stroke-width="2.5" />
    <line x1="0" y1="55" x2="100" y2="55" stroke="#0E4B33" stroke-width="2.5" />
    <!-- Radiant morning sun rays through window -->
    <circle cx="50" cy="55" r="16" fill="#FFC21A" opacity="0.8" />
  </g>

  <!-- Decorative motifs (marigold & paisleys) -->
  <g transform="translate(315, 45)">
    <ellipse cx="18" cy="8" rx="5" ry="7" fill="#FFC21A" />
    <ellipse cx="18" cy="28" rx="5" ry="7" fill="#FFC21A" />
    <ellipse cx="8" cy="18" rx="7" ry="5" fill="#FFC21A" />
    <ellipse cx="28" cy="18" rx="7" ry="5" fill="#FFC21A" />
    <circle cx="18" cy="18" r="6" fill="#D2401F" />
    <circle cx="18" cy="18" r="3" fill="#FFC21A" />
  </g>
  <g transform="translate(325, 260)" fill="#FFC21A">
    <circle cx="8" cy="8" r="3" />
    <circle cx="24" cy="8" r="3" fill="#D2401F" />
    <circle cx="8" cy="24" r="3" fill="#D2401F" />
    <circle cx="24" cy="24" r="4" fill="#0E4B33" />
  </g>

  <!-- Handwoven Floor Mat / Rug -->
  <ellipse cx="210" cy="335" rx="150" ry="32" fill="#F6C1CF" opacity="0.75" />
  <ellipse cx="210" cy="335" rx="135" ry="26" fill="none" stroke="#D6336C" stroke-width="2" stroke-dasharray="6 4" />

  <!-- Cozy Bolster / Floor Cushion (behind woman) -->
  <rect x="235" y="225" width="45" height="90" rx="18" transform="rotate(35 255 270)" fill="#FFC21A" stroke="#2A2622" stroke-width="2" />
  <line x1="240" y1="230" x2="280" y2="285" stroke="#D2401F" stroke-width="2.5" />

  <!-- ================= LOW WOODEN CHOWKI (DESK) ================= -->
  <g transform="translate(100, 260)">
    <!-- Desktop top -->
    <rect x="0" y="0" width="130" height="12" rx="3" fill="#2A2622" />
    <!-- Short carved legs -->
    <rect x="10" y="12" width="10" height="26" rx="2" fill="#2A2622" />
    <rect x="110" y="12" width="10" height="26" rx="2" fill="#2A2622" />

    <!-- Open Slim Laptop on Chowki -->
    <g transform="translate(45, -28)">
      <polygon points="4,28 36,28 34,2 6,2" fill="#2A2622" />
      <polygon points="6,26 34,26 32,4 8,4" fill="#2B59D9" />
      <polygon points="8,24 32,24 30,6 10,6" fill="#FFF6E5" />
      <!-- Content lines on screen -->
      <line x1="12" y1="11" x2="28" y2="11" stroke="#2A2622" stroke-width="1.2" />
      <line x1="12" y1="15" x2="24" y2="15" stroke="#2A2622" stroke-width="1.2" />
      <!-- Keyboard base -->
      <polygon points="0,30 40,30 36,36 4,36" fill="#4A4540" />
    </g>

    <!-- Steaming Clay Kulhar of Chai on Chowki -->
    <g transform="translate(10, -22)">
      <polygon points="4,10 16,10 14,26 6,26" fill="#C08052" />
      <ellipse cx="10" cy="10" rx="5" ry="1.8" fill="#FFF6E5" />
      <!-- Rising steam -->
      <path d="M8,6 Q10,2 8,-2" stroke="#FFC21A" stroke-width="1.5" fill="none" stroke-linecap="round" />
      <path d="M12,6 Q14,2 12,-2" stroke="#FFC21A" stroke-width="1.5" fill="none" stroke-linecap="round" />
    </g>
  </g>

  <!-- Embroidery Hoop & Work Basket on Floor (Left) -->
  <g transform="translate(55, 305)">
    <circle cx="20" cy="20" r="18" stroke="#C08052" stroke-width="3.5" fill="#FFF6E5" />
    <!-- Floral embroidery stitch underway in hoop -->
    <circle cx="20" cy="20" r="5" fill="#D6336C" />
    <circle cx="20" cy="14" r="3" fill="#FFC21A" />
    <circle cx="20" cy="26" r="3" fill="#FFC21A" />
    <circle cx="14" cy="20" r="3" fill="#FFC21A" />
    <circle cx="26" cy="20" r="3" fill="#FFC21A" />
  </g>

  <!-- ================= WOMAN WORKING COMFORTABLY CROSS-LEGGED ================= -->
  <g transform="translate(155, 105) scale(1.15)">
    <!-- Cross-legged seated saree fold in Marigold & Cobalt -->
    <path d="M35,145 L105,145 C115,185 110,215 90,215 L25,215 C10,215 15,185 35,145 Z" fill="#FFC21A" />
    <!-- Blouse & draped pallu -->
    <path d="M42,98 L94,98 L98,135 L40,135 Z" fill="#2B59D9" />
    <path d="M38,135 L88,98 L98,114 L46,148 Z" fill="#FFC21A" />

    <!-- Neck & Head -->
    <rect x="63" y="72" width="10" height="28" fill="#C08052" />
    <circle cx="68" cy="56" r="18" fill="#C08052" />
    <!-- Relaxed long braid over shoulder with marigold blossom -->
    <circle cx="68" cy="38" r="11" fill="#3A2418" />
    <circle cx="78" cy="36" r="4" fill="#FFC21A" />
    <path d="M49,56 C49,40 58,39 68,39 C78,39 87,40 87,56 C83,45 76,43 68,43 C60,43 53,45 49,56 Z" fill="#3A2418" />
    <ellipse cx="50" cy="70" rx="4.5" ry="6.5" fill="#3A2418" />
    <ellipse cx="48" cy="82" rx="4" ry="6" fill="#3A2418" />
    <ellipse cx="46" cy="94" rx="3.5" ry="5.5" fill="#3A2418" />

    <!-- Peaceful, gentle smiling face -->
    <path d="M60,56 Q63,59 66,56" stroke="#2A2622" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M70,56 Q73,59 76,56" stroke="#2A2622" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M64,66 Q68,71 72,66" stroke="#2A2622" stroke-width="2" fill="none" stroke-linecap="round" />
    <circle cx="68" cy="50" r="1.8" fill="#D2401F" />

    <!-- Arms typing / resting gently toward chowki desk -->
    <path d="M40,98 L24,136 L34,138 L48,105 Z" fill="#2B59D9" />
    <path d="M92,98 L80,136 L70,136 L82,105 Z" fill="#2B59D9" />
    <circle cx="28" cy="140" r="5" fill="#C08052" />
    <circle cx="76" cy="140" r="5" fill="#C08052" />
    <!-- Bangles on wrist -->
    <rect x="74" y="132" width="6" height="3" fill="#FFC21A" />
    <rect x="74" y="128" width="6" height="3" fill="#D6336C" />
  </g>
</svg>
