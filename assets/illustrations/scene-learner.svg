<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Plain cream background -->
  <rect width="400" height="400" fill="#FFF6E5" />

  <!-- Traditional Courtyard Doorframe & Archway in Forest & Oat -->
  <rect x="60" y="40" width="280" height="320" rx="8" fill="#F1E8D8" />
  <!-- Door recess -->
  <path d="M100,320 L100,120 C100,75 140,55 200,55 C260,55 300,75 300,120 L300,320 Z" fill="#E7DFCE" />
  <!-- Wooden door lintel / arch trim -->
  <path d="M96,120 C96,70 138,50 200,50 C262,50 304,70 304,120" stroke="#0E4B33" stroke-width="8" fill="none" />

  <!-- Marigold Toran (Garland) draped across doorframe -->
  <path d="M92,120 Q145,145 200,125 Q255,145 308,120" stroke="#0E4B33" stroke-width="2.5" fill="none" />
  <!-- Hanging Marigold flowers & mango leaves on toran -->
  <g transform="translate(100, 116)">
    <circle cx="6" cy="10" r="5.5" fill="#FFC21A" />
    <circle cx="6" cy="10" r="2.5" fill="#D2401F" />
  </g>
  <g transform="translate(140, 126)">
    <circle cx="6" cy="10" r="5.5" fill="#FFC21A" />
    <circle cx="6" cy="10" r="2.5" fill="#D2401F" />
    <path d="M6,10 L6,22 C6,25 2,27 6,32 C10,27 6,25 6,22 Z" fill="#0E4B33" />
  </g>
  <g transform="translate(194, 120)">
    <circle cx="6" cy="10" r="6" fill="#D2401F" />
    <circle cx="6" cy="10" r="3" fill="#FFC21A" />
  </g>
  <g transform="translate(248, 126)">
    <circle cx="6" cy="10" r="5.5" fill="#FFC21A" />
    <circle cx="6" cy="10" r="2.5" fill="#D2401F" />
    <path d="M6,10 L6,22 C6,25 2,27 6,32 C10,27 6,25 6,22 Z" fill="#0E4B33" />
  </g>
  <g transform="translate(290, 116)">
    <circle cx="6" cy="10" r="5.5" fill="#FFC21A" />
    <circle cx="6" cy="10" r="2.5" fill="#D2401F" />
  </g>

  <!-- Doorstep Threshold Steps -->
  <rect x="40" y="315" width="320" height="18" rx="3" fill="#0E4B33" />
  <rect x="25" y="333" width="350" height="25" rx="4" fill="#2A2622" />

  <!-- A small bird perched on the doorway lintel -->
  <g transform="translate(285, 45) scale(0.9)">
    <path d="M4,16 C8,10 16,8 24,10 C28,6 34,4 38,5 C35,10 33,14 31,18 C23,22 14,22 8,19 Z" fill="#D2401F" />
    <circle cx="33" cy="8" r="1.5" fill="#FFF6E5" />
    <line x1="16" y1="21" x2="16" y2="26" stroke="#2A2622" stroke-width="1.5" />
    <line x1="22" y1="21" x2="22" y2="26" stroke="#2A2622" stroke-width="1.5" />
  </g>

  <!-- Steaming Chai Glass on Step -->
  <g transform="translate(85, 290)">
    <polygon points="6,12 18,12 15,30 9,30" fill="#C08052" />
    <ellipse cx="12" cy="12" rx="6" ry="2" fill="#FFF6E5" />
    <!-- Steam -->
    <path d="M10,8 Q12,3 10,0" stroke="#FFC21A" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M14,8 Q16,3 14,0" stroke="#FFC21A" stroke-width="1.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- ================= WOMAN SITTING ON DOORSTEP WITH LAPTOP ================= -->
  <g transform="translate(130, 115) scale(1.15)">
    <!-- Seated Lower Body / Modern Kurta over Cobalt Jeans -->
    <path d="M30,150 L100,150 C110,185 105,215 90,215 L35,215 C25,215 20,185 30,150 Z" fill="#2B59D9" />
    <!-- Vermilion Kurta top -->
    <path d="M36,98 L94,98 L100,165 L30,165 Z" fill="#D2401F" />
    <line x1="65" y1="98" x2="65" y2="140" stroke="#FFC21A" stroke-width="2" />

    <!-- Feet on bottom step -->
    <ellipse cx="45" cy="216" rx="8" ry="3.5" fill="#F3D0B0" />
    <ellipse cx="80" cy="216" rx="8" ry="3.5" fill="#F3D0B0" />

    <!-- Neck & Head -->
    <rect x="60" y="70" width="10" height="30" fill="#F3D0B0" />
    <circle cx="65" cy="55" r="18" fill="#F3D0B0" />
    <!-- Bouncy wavy curls -->
    <circle cx="50" cy="46" r="9" fill="#6B3F25" />
    <circle cx="60" cy="38" r="9" fill="#6B3F25" />
    <circle cx="72" cy="38" r="9" fill="#6B3F25" />
    <circle cx="80" cy="46" r="9" fill="#6B3F25" />
    <path d="M51,48 C55,42 75,42 79,48 C75,44 57,44 51,48 Z" fill="#6B3F25" />

    <!-- Joyful, Focused Expression -->
    <path d="M58,54 Q61,57 64,54" stroke="#2A2622" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M68,54 Q71,57 74,54" stroke="#2A2622" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M61,64 Q65,69 70,64" stroke="#2A2622" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Arms resting forward typing on laptop -->
    <path d="M38,98 L48,136 L60,136 L48,98 Z" fill="#D2401F" />
    <path d="M92,98 L82,136 L70,136 L82,98 Z" fill="#D2401F" />
    <circle cx="54" cy="138" r="5" fill="#F3D0B0" />
    <circle cx="76" cy="138" r="5" fill="#F3D0B0" />

    <!-- ================= OPEN LAPTOP ON LAP ================= -->
    <g transform="translate(35, 122)">
      <!-- Laptop Screen (open at slight angle) -->
      <polygon points="12,18 48,18 46,-4 14,-4" fill="#2A2622" />
      <polygon points="14,16 46,16 44,-2 16,-2" fill="#2B59D9" />
      <polygon points="16,14 44,14 42,0 18,0" fill="#FFF6E5" />
      <!-- Content lines on screen -->
      <line x1="21" y1="4" x2="39" y2="4" stroke="#2A2622" stroke-width="1.5" />
      <line x1="21" y1="8" x2="35" y2="8" stroke="#2A2622" stroke-width="1.5" />
      <!-- Laptop Base / Keyboard on lap -->
      <polygon points="6,20 54,20 50,30 10,30" fill="#4A4540" />
      <polygon points="12,21 48,21 45,28 15,28" fill="#2A2622" />
    </g>
  </g>
</svg>
