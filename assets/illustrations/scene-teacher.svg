<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Plain cream background -->
  <rect width="400" height="400" fill="#FFF6E5" />

  <!-- Background organic warmth -->
  <path d="M60,60 C180,20 330,50 360,150 C390,250 320,360 200,370 C70,380 20,280 35,170 C45,110 50,70 60,60 Z" fill="#F1E8D8" />
  <circle cx="290" cy="90" r="50" fill="#F6C1CF" opacity="0.6" />

  <!-- Courtyard Dhurrie / Mat where learners sit -->
  <polygon points="150,260 360,260 380,340 130,340" fill="#E8DFCF" stroke="#D8CEB9" stroke-width="2" />
  <!-- Pattern on mat border -->
  <line x1="155" y1="266" x2="355" y2="266" stroke="#0E4B33" stroke-width="2" stroke-dasharray="6 4" />
  <line x1="135" y1="334" x2="375" y2="334" stroke="#0E4B33" stroke-width="2" stroke-dasharray="6 4" />

  <!-- Decorative motifs (marigold, rangoli dots) -->
  <g transform="translate(40, 45)">
    <ellipse cx="20" cy="8" rx="5" ry="8" fill="#FFC21A" />
    <ellipse cx="20" cy="32" rx="5" ry="8" fill="#FFC21A" />
    <ellipse cx="8" cy="20" rx="8" ry="5" fill="#FFC21A" />
    <ellipse cx="32" cy="20" rx="8" ry="5" fill="#FFC21A" />
    <circle cx="20" cy="20" r="7" fill="#D2401F" />
    <circle cx="20" cy="20" r="4" fill="#FFC21A" />
  </g>
  <g transform="translate(325, 45)" fill="#FFC21A">
    <circle cx="8" cy="8" r="3" />
    <circle cx="24" cy="8" r="3" fill="#D2401F" />
    <circle cx="8" cy="24" r="3" fill="#D2401F" />
    <circle cx="24" cy="24" r="4" fill="#0E4B33" />
  </g>

  <!-- Teaching Blackboard / Slate on wooden easel -->
  <g transform="translate(45, 130)">
    <!-- Easel legs -->
    <line x1="10" y1="185" x2="35" y2="45" stroke="#2A2622" stroke-width="3.5" />
    <line x1="70" y1="185" x2="45" y2="45" stroke="#2A2622" stroke-width="3.5" />
    <line x1="40" y1="45" x2="40" y2="185" stroke="#2A2622" stroke-width="2.5" />
    <!-- Slate board -->
    <rect x="0" y="55" width="80" height="60" rx="4" fill="#0E4B33" stroke="#FFC21A" stroke-width="3" />
    <!-- Symbolic geometry / lesson diagrams on board -->
    <circle cx="25" cy="85" r="10" stroke="#FFF6E5" stroke-width="1.8" fill="none" />
    <polygon points="50,75 62,95 38,95" stroke="#FFF6E5" stroke-width="1.8" fill="none" />
    <line x1="15" y1="104" x2="65" y2="104" stroke="#FFC21A" stroke-width="1.5" />
  </g>

  <!-- ================= TEACHER WOMAN (STANDING ON LEFT) ================= -->
  <g transform="translate(100, 75) scale(1.15)">
    <!-- Rani Pink Saree with Marigold border -->
    <path d="M40,125 L94,125 C100,175 102,225 98,260 L38,260 C34,225 36,175 40,125 Z" fill="#D6336C" />
    <path d="M38,254 L98,254 L98,260 L38,260 Z" fill="#FFC21A" />
    <!-- Pleats -->
    <line x1="60" y1="125" x2="60" y2="252" stroke="#FFC21A" stroke-width="2" />
    <line x1="68" y1="125" x2="68" y2="252" stroke="#FFC21A" stroke-width="2" />
    <!-- Blouse & Pallu -->
    <path d="M44,100 L90,100 L94,130 L40,130 Z" fill="#0E4B33" />
    <path d="M40,130 L88,100 L94,112 L46,142 Z" fill="#FFC21A" />

    <!-- Neck & Head -->
    <rect x="62" y="78" width="10" height="26" fill="#94603A" />
    <circle cx="67" cy="60" r="18" fill="#94603A" />
    <!-- Grey hair bun indicating experienced master educator -->
    <circle cx="67" cy="40" r="12" fill="#B9B4AE" />
    <circle cx="77" cy="38" r="4" fill="#FFC21A" />
    <path d="M48,60 C48,44 57,42 67,42 C77,42 86,44 86,60 C82,48 75,46 67,46 C59,46 52,48 48,60 Z" fill="#B9B4AE" />

    <!-- Glasses & Warm smile -->
    <circle cx="61" cy="60" r="6" stroke="#2A2622" stroke-width="1.5" fill="none" />
    <circle cx="73" cy="60" r="6" stroke="#2A2622" stroke-width="1.5" fill="none" />
    <line x1="67" y1="60" x2="67" y2="60" stroke="#2A2622" stroke-width="1.5" />
    <path d="M63,70 Q67,74 71,70" stroke="#2A2622" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <circle cx="67" cy="54" r="1.8" fill="#D2401F" />

    <!-- Left hand pointing toward the board -->
    <path d="M42,100 L18,110 L22,118 L48,112 Z" fill="#0E4B33" />
    <circle cx="16" cy="112" r="5" fill="#94603A" />

    <!-- Right arm gesturing warmly toward students -->
    <path d="M88,100 L110,122 L104,128 L82,108 Z" fill="#0E4B33" />
    <circle cx="112" cy="126" r="5" fill="#94603A" />
    <!-- Bangles on wrists -->
    <rect x="102" y="118" width="5" height="3" fill="#FFC21A" />
    <rect x="102" y="122" width="5" height="3" fill="#D6336C" />
  </g>

  <!-- ================= SMALL GROUP OF 2 WOMEN SEATED LISTENING ================= -->

  <!-- Student 1 (Mid-right, Salwar in Cobalt) -->
  <g transform="translate(200, 180) scale(0.95)">
    <!-- Seated fold -->
    <path d="M25,120 L85,120 C95,150 90,175 75,175 L30,175 C15,175 15,150 25,120 Z" fill="#2B59D9" />
    <rect x="35" y="80" width="30" height="42" rx="4" fill="#FFC21A" />
    <!-- Neck & Head turned toward teacher -->
    <rect x="46" y="60" width="8" height="22" fill="#E0A877" />
    <circle cx="50" cy="46" r="16" fill="#E0A877" />
    <circle cx="50" cy="30" r="10" fill="#1B1210" />
    <path d="M35,46 C35,32 42,31 50,31 C58,31 65,32 65,46 Z" fill="#1B1210" />
    <!-- Eyes listening attentively -->
    <path d="M43,46 Q46,49 49,46" stroke="#2A2622" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M46,54 Q50,58 54,54" stroke="#2A2622" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <!-- Open notebook on lap -->
    <polygon points="30,122 45,118 60,122 45,126" fill="#FFF6E5" stroke="#2A2622" stroke-width="1.2" />
  </g>

  <!-- Student 2 (Far-right, Saree in Forest) -->
  <g transform="translate(270, 185) scale(0.95)">
    <path d="M25,120 L85,120 C95,150 90,175 75,175 L30,175 C15,175 15,150 25,120 Z" fill="#0E4B33" />
    <rect x="35" y="80" width="30" height="42" rx="4" fill="#D2401F" />
    <path d="M30,120 L65,80 L72,90 L38,130 Z" fill="#FFC21A" />
    <rect x="46" y="60" width="8" height="22" fill="#C08052" />
    <circle cx="50" cy="46" r="16" fill="#C08052" />
    <circle cx="50" cy="30" r="10" fill="#3A2418" />
    <path d="M35,46 C35,32 42,31 50,31 C58,31 65,32 65,46 Z" fill="#3A2418" />
    <path d="M43,46 Q46,49 49,46" stroke="#2A2622" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M46,54 Q50,58 54,54" stroke="#2A2622" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <circle cx="50" cy="41" r="1.5" fill="#D2401F" />
  </g>
</svg>
