<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Plain cream background -->
  <rect width="400" height="400" fill="#FFF6E5" />

  <!-- Background organic warmth -->
  <path d="M70,50 C200,20 330,50 360,150 C390,250 310,360 190,370 C70,380 30,290 35,180 C40,110 50,70 70,50 Z" fill="#F1E8D8" />

  <!-- Traditional Courtyard Archway / Doorway -->
  <path d="M100,340 L100,120 C100,60 150,30 200,30 C250,30 300,60 300,120 L300,340 Z" fill="#E8DFCF" stroke="#0E4B33" stroke-width="6" />

  <!-- Decorative Marigold Toran Garland across top arch -->
  <path d="M96,120 Q150,145 200,125 Q250,145 304,120" stroke="#0E4B33" stroke-width="2.5" fill="none" />
  <circle cx="106" cy="122" r="5" fill="#FFC21A" />
  <circle cx="150" cy="132" r="5" fill="#FFC21A" />
  <circle cx="200" cy="126" r="6" fill="#D2401F" />
  <circle cx="250" cy="132" r="5" fill="#FFC21A" />
  <circle cx="294" cy="122" r="5" fill="#FFC21A" />

  <!-- Morning Sun glowing through archway -->
  <circle cx="200" cy="85" r="28" fill="#FFC21A" opacity="0.8" />

  <!-- Flying bird passing through -->
  <g transform="translate(260, 60) scale(0.9)">
    <path d="M4,16 C8,10 16,8 24,10 C28,6 34,4 38,5 C35,10 33,14 31,18 C23,22 14,22 8,19 Z" fill="#0E4B33" />
    <circle cx="33" cy="8" r="1.5" fill="#FFF6E5" />
  </g>

  <!-- Doorstep Threshold Steps -->
  <rect x="50" y="325" width="300" height="18" rx="3" fill="#0E4B33" />
  <rect x="35" y="343" width="330" height="25" rx="4" fill="#2A2622" />

  <!-- ================= WOMAN STEPPING FORWARD THROUGH DOORWAY ================= -->
  <g transform="translate(130, 95) scale(1.15)">
    <!-- Deep vermilion saree stepping across threshold -->
    <path d="M40,125 L94,125 C102,175 104,215 98,245 L36,245 C30,215 34,175 40,125 Z" fill="#D2401F" />
    <path d="M36,238 L98,238 L98,244 L36,244 Z" fill="#FFC21A" />
    <line x1="58" y1="125" x2="58" y2="238" stroke="#FFC21A" stroke-width="2" />
    <line x1="66" y1="125" x2="66" y2="238" stroke="#FFC21A" stroke-width="2" />

    <!-- Feet stepping forward -->
    <ellipse cx="50" cy="246" rx="8" ry="3.5" fill="#46291A" />
    <ellipse cx="85" cy="248" rx="8" ry="3.5" fill="#46291A" />

    <!-- Blouse & Pallu -->
    <path d="M44,100 L90,100 L94,130 L40,130 Z" fill="#0E4B33" />
    <path d="M40,130 L88,100 L94,112 L46,142 Z" fill="#FFC21A" />

    <!-- Neck & Head -->
    <rect x="62" y="76" width="10" height="26" fill="#46291A" />
    <circle cx="67" cy="58" r="18" fill="#46291A" />
    <!-- Braid hair -->
    <path d="M48,58 C48,42 57,40 67,40 C77,40 86,42 86,58 C82,46 75,44 67,44 C59,44 52,46 48,58 Z" fill="#1B1210" />
    <ellipse cx="48" cy="72" rx="4.5" ry="6.5" fill="#1B1210" />
    <ellipse cx="46" cy="84" rx="4" ry="6" fill="#1B1210" />
    <ellipse cx="44" cy="96" rx="3.5" ry="5.5" fill="#1B1210" />

    <!-- Radiant, bold expression -->
    <path d="M59,58 Q62,61 65,58" stroke="#FFF6E5" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M69,58 Q72,61 75,58" stroke="#FFF6E5" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M63,68 Q67,73 72,68" stroke="#FFF6E5" stroke-width="2" fill="none" stroke-linecap="round" />
    <circle cx="67" cy="52" r="1.8" fill="#FFC21A" />

    <!-- Arm waving forward stepping into future -->
    <path d="M88,100 L112,68 L122,72 L100,110 Z" fill="#0E4B33" />
    <circle cx="118" cy="66" r="6" fill="#46291A" />
    <!-- Bangles on wrist -->
    <rect x="108" y="74" width="7" height="3" fill="#FFC21A" />
    <rect x="108" y="78" width="7" height="3" fill="#D6336C" />
  </g>
</svg>
