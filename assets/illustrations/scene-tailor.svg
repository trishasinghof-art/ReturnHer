<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Plain cream background -->
  <rect width="400" height="400" fill="#FFF6E5" />

  <!-- Background organic color block (Blush & Oat) -->
  <path d="M70,50 C190,20 330,60 360,160 C390,260 310,360 190,370 C70,380 30,290 35,180 C40,110 50,60 70,50 Z" fill="#F1E8D8" />
  <circle cx="310" cy="90" r="45" fill="#F6C1CF" opacity="0.6" />

  <!-- Decorative motifs (marigold, scissors, paisley, dots) -->
  <!-- Top Marigold -->
  <g transform="translate(300, 45)">
    <ellipse cx="20" cy="8" rx="5" ry="8" fill="#FFC21A" />
    <ellipse cx="20" cy="32" rx="5" ry="8" fill="#FFC21A" />
    <ellipse cx="8" cy="20" rx="8" ry="5" fill="#FFC21A" />
    <ellipse cx="32" cy="20" rx="8" ry="5" fill="#FFC21A" />
    <ellipse cx="11" cy="11" rx="5" ry="8" transform="rotate(-45 11 11)" fill="#D2401F" />
    <ellipse cx="29" cy="29" rx="5" ry="8" transform="rotate(-45 29 29)" fill="#D2401F" />
    <ellipse cx="29" cy="11" rx="5" ry="8" transform="rotate(45 29 11)" fill="#D2401F" />
    <ellipse cx="11" cy="29" rx="5" ry="8" transform="rotate(45 11 29)" fill="#D2401F" />
    <circle cx="20" cy="20" r="7" fill="#D2401F" />
    <circle cx="20" cy="20" r="4" fill="#FFC21A" />
  </g>
  <!-- Paisley on left -->
  <g transform="translate(45, 140)">
    <path d="M20,45 C8,45 3,36 3,25 C3,13 13,7 22,2 C23,7 21,13 15,18 C11,20 10,23 10,26 C10,31 13,38 20,38 C26,38 31,33 31,26 C31,21 28,18 24,15 C28,11 33,8 36,8 C36,18 36,45 20,45 Z" fill="#0E4B33" />
  </g>
  <!-- Rangoli dot cluster -->
  <g transform="translate(60, 290)" fill="#FFC21A">
    <circle cx="8" cy="8" r="3" />
    <circle cx="24" cy="8" r="3" fill="#D2401F" />
    <circle cx="40" cy="8" r="3" />
    <circle cx="8" cy="24" r="3" fill="#D2401F" />
    <circle cx="24" cy="24" r="4.5" fill="#0E4B33" />
    <circle cx="40" cy="24" r="3" fill="#D2401F" />
    <circle cx="8" cy="40" r="3" />
    <circle cx="24" cy="40" r="3" fill="#D2401F" />
    <circle cx="40" cy="40" r="3" />
  </g>

  <!-- Tailoring Workshop Table -->
  <rect x="70" y="270" width="260" height="14" rx="4" fill="#0E4B33" />
  <rect x="90" y="284" width="12" height="75" fill="#2A2622" />
  <rect x="295" y="284" width="12" height="75" fill="#2A2622" />
  <rect x="75" y="355" width="40" height="8" rx="2" fill="#2A2622" />
  <rect x="280" y="355" width="40" height="8" rx="2" fill="#2A2622" />

  <!-- Draped Handloom Fabric over Table Edge -->
  <path d="M190,270 L260,270 L265,335 C255,340 240,335 235,342 C225,338 210,340 205,335 L190,270 Z" fill="#D2401F" />
  <line x1="200" y1="270" x2="210" y2="335" stroke="#FFC21A" stroke-width="2" />
  <line x1="230" y1="270" x2="240" y2="335" stroke="#FFC21A" stroke-width="2" />

  <!-- Sewing Machine Silhouette -->
  <g transform="translate(195, 175) scale(0.95)">
    <rect x="0" y="80" width="90" height="14" rx="4" fill="#2A2622" />
    <path d="M15,80 L15,25 L75,25 L75,42 L52,42 L52,80 Z" fill="#2A2622" />
    <!-- Golden decorative detailing -->
    <path d="M22,30 L68,30" stroke="#FFC21A" stroke-width="2.5" />
    <!-- Machine Handwheel -->
    <circle cx="15" cy="40" r="14" stroke="#FFC21A" stroke-width="4" fill="#2A2622" />
    <circle cx="15" cy="40" r="4" fill="#FFC21A" />
    <!-- Needle Bar & Foot -->
    <line x1="75" y1="42" x2="75" y2="74" stroke="#B9B4AE" stroke-width="3" />
    <rect x="67" y="74" width="16" height="5" rx="1.5" fill="#FFC21A" />
    <!-- Thread Spool on Top pin -->
    <line x1="35" y1="16" x2="35" y2="25" stroke="#B9B4AE" stroke-width="2" />
    <rect x="28" y="10" width="14" height="12" rx="2" fill="#D6336C" />
  </g>

  <!-- Golden Tailor Scissors on Table -->
  <g transform="translate(85, 255)">
    <circle cx="8" cy="10" r="4" stroke="#FFC21A" stroke-width="2" fill="none" />
    <circle cx="16" cy="10" r="4" stroke="#FFC21A" stroke-width="2" fill="none" />
    <line x1="9" y1="7" x2="26" y2="1" stroke="#B9B4AE" stroke-width="2" stroke-linecap="round" />
    <line x1="15" y1="7" x2="23" y2="1" stroke="#B9B4AE" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- ================= MASTER TAILOR WOMAN ================= -->
  <g transform="translate(110, 85) scale(1.1)">
    <!-- Seated body / Saree in Emerald & Vermilion -->
    <path d="M40,130 L95,130 C102,175 105,215 100,245 L35,245 C30,215 34,175 40,130 Z" fill="#0E4B33" />
    <!-- Pleats -->
    <line x1="58" y1="130" x2="58" y2="242" stroke="#FFC21A" stroke-width="2" />
    <line x1="66" y1="130" x2="66" y2="242" stroke="#FFC21A" stroke-width="2" />
    <!-- Blouse & Pallu -->
    <path d="M44,102 L92,102 L96,134 L40,134 Z" fill="#D2401F" />
    <path d="M40,134 L88,102 L96,116 L46,146 Z" fill="#0E4B33" />
    <!-- Golden Saree border -->
    <path d="M36,240 L100,240 L100,246 L36,246 Z" fill="#FFC21A" />

    <!-- Neck & Head -->
    <rect x="63" y="78" width="10" height="26" fill="#E0A877" />
    <circle cx="68" cy="60" r="18" fill="#E0A877" />
    <!-- Neat hair bun with marigold pin -->
    <circle cx="68" cy="40" r="12" fill="#1B1210" />
    <circle cx="78" cy="38" r="4.5" fill="#FFC21A" />
    <path d="M49,60 C49,44 58,42 68,42 C78,42 87,44 87,60 C83,48 76,46 68,46 C60,46 53,48 49,60 Z" fill="#1B1210" />

    <!-- Joyful smiling face -->
    <path d="M60,60 Q63,64 66,60" stroke="#2A2622" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M70,60 Q73,64 76,60" stroke="#2A2622" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M63,70 Q68,75 73,70" stroke="#2A2622" stroke-width="2" fill="none" stroke-linecap="round" />
    <circle cx="68" cy="54" r="2" fill="#D2401F" />

    <!-- Right hand resting on sewing machine fabric -->
    <path d="M88,102 L110,138 L102,142 L82,110 Z" fill="#D2401F" />
    <circle cx="108" cy="144" r="6" fill="#E0A877" />
    <rect x="98" y="136" width="6" height="3" fill="#FFC21A" />
    <rect x="98" y="132" width="6" height="3" fill="#D6336C" />

    <!-- Left arm raised holding up the certificate scroll -->
    <path d="M44,102 L22,62 L32,58 L54,98 Z" fill="#D2401F" />
    <circle cx="24" cy="56" r="6" fill="#E0A877" />
    <rect x="26" y="60" width="6" height="3" fill="#FFC21A" />
    <rect x="26" y="64" width="6" height="3" fill="#D6336C" />

    <!-- ================= CERTIFICATE SCROLL HELD UP HIGH ================= -->
    <g transform="translate(-10, 22) rotate(-8)">
      <rect x="8" y="12" width="48" height="18" rx="4" fill="#FFF6E5" stroke="#2A2622" stroke-width="2" />
      <rect x="28" y="9" width="10" height="24" rx="2" fill="#D6336C" />
      <line x1="14" y1="18" x2="24" y2="18" stroke="#2A2622" stroke-width="1.5" />
      <line x1="14" y1="23" x2="24" y2="23" stroke="#2A2622" stroke-width="1.5" />
      <line x1="42" y1="18" x2="50" y2="18" stroke="#2A2622" stroke-width="1.5" />
      <line x1="42" y1="23" x2="50" y2="23" stroke="#2A2622" stroke-width="1.5" />
    </g>
  </g>
</svg>
