    <ellipse cx="25" cy="10" rx="7" ry="11" fill="#FFC21A" />
    <ellipse cx="25" cy="40" rx="7" ry="11" fill="#FFC21A" />
    <ellipse cx="10" cy="25" rx="11" ry="7" fill="#FFC21A" />
