    <circle cx="25" cy="25" r="6" fill="#FFC21A" />
    <circle cx="25" cy="6" r="3" fill="#D2401F" />
    <circle cx="25" cy="44" r="3" fill="#D2401F" />
    <circle cx="6" cy="25" r="3" fill="#D2401F" />
    <circle cx="44" cy="25" r="3" fill="#D2401F" />
